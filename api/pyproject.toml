[project]
name = "calcusol-api"
version = "1.3.0"
description = "API de Calcusol: radiación (R1) y física y finanzas (R3). Solo lo que la API necesita."
requires-python = ">=3.11"
dependencies = [
    # Mismas versiones que el uv.lock de la raíz (R1 y R3)
    "lightgbm==4.7.0",
    "pvlib==0.16.1",
    "pandas==3.1.1",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "joblib==1.6.0",
    # Leer el manifiesto y el modelo activo del registro en S3 (ml/registro.py)
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    # Solo para servir la API
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.7,<3",
]

[tool.uv]
# La API no es un paquete instalable: el código de calcusol se copia desde src/ en la imagen.
package = false
