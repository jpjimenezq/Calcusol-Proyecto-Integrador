[project]
name = "calcusol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.16.1",
    "pyspark==4.0.1",
    "requests>=2.32",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",          # lectura y escritura de parquet con pandas
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "openpyxl>=3.1",        # leer y escribir Excel (evaluación R2 y R3)
    "fsspec>=2024.6",       # registro de modelos: misma lógica en local y S3
    "s3fs>=2024.6",         # lectura/escritura en s3:// (Gold y modelos)
]

[project.optional-dependencies]
# Solo para ml/comparar_modelos.py y ml/buscar_hiperparametros.py (o notebooks/comparacion_modelos.ipynb)
comparacion = [
    "xgboost>=2.0",
    "optuna>=3.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcusol"]
