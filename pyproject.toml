[project]
name = "calcusol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.16.1",
    "pyspark==4.0.1",
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcusol"]
