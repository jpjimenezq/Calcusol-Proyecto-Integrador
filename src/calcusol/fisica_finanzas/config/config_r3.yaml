# =====================================================================
# Calcusol · R3 · Ficha de supuestos (UN solo archivo, nunca en el código)
# ---------------------------------------------------------------------
# Cada dato lleva: valor, fuente (con enlace) y estado.
#   OK         -> fuente oficial o del fabricante, verificada
#   PUBLICADO  -> precios publicados por instaladores (plan B: sin cotizaciones)
#   DECISION   -> elección del equipo, explicada (no es un dato del mundo)
#   PENDIENTE  -> no se encontró fuente; NO se usa hasta tenerla
# Fecha de consulta de todas las fuentes: 2026-11-19
# =====================================================================

datos:
  # ---- VERSIÓN FINAL (21-nov-2026) ----
  tabla_gold: datos/gold_v1_unico.parquet           # gold v1 de Felipe (R5): 123 estaciones, 2005-2022
  modelo: datos/modelo_lgbm.joblib                  # modelo final de R1: LightGBM, 17 variables
  # El LightGBM predice la DIFERENCIA con la NASA (IDEAM - NASA): Prediccion = NASA + modelo
  modelo_predice: diferencia_con_nasa               # o: radiacion (modelos que predicen el valor directo)
  # R1 calculó zenit, azimut y g0_horiz con la hora Fecha + 30 min (verificado contra su Excel)
  desfase_variables_sol_min: 30
  anios_prueba: []                                  # vacío = todos los años de cada estación
  # Excel FINAL de evaluación de R2 (Manuela): validación cruzada en 112 sitios.
  #  - hoja mejora_por_sitio: columna caso_sugerido (3 casos: mayor, mediana y menor mejora)
  #  - hoja serie_horaria: IDEAM, NASA y modelo hora por hora en el año con más datos de cada caso.
  #    El modelo viene de un pliegue que NO vio ese sitio: es el resultado honesto para un lugar nuevo.
  casos_r2: datos/evaluacion_lightgbm_final.xlsx
  columna_mejora: mejora_para_regla_D16             # mejora del error MENSUAL (cifra de negocio de R2)
  columna_modelo_r2: Modelo_principal               # LightGBM con ubicación
  # (Versión anterior: predicciones ya hechas por R2. Vacío = se usa el modelo de arriba.)
  predicciones_r2:
  modelo_r2: XGBoost (completo)
  tabla_mejora_r2:
  columnas_r2:
    estacion: CodigoEstacion
    mejora_pct: Mejora_pct
  carpeta_resultados: resultados
  # Para calcular un punto cualquiera (sin estación): años que se descargan de NASA
  anios_nasa_punto: [2023, 2024, 2025]
  # Ajuste de horas para que la descarga coincida con la limpieza del equipo.
  # Se averigua con calibrar_desfase_nasa (notebook, Paso 11). 0 = sin ajuste extra.
  desfase_nasa_horas: 0

